rules:
  # Bronze

  action-setup:
    status: done
    comment: >-
      All services (add_vehicle, add_maintenance_item, add_service_record) are
      registered inside async_setup_entry.

  appropriate-polling:
    status: exempt
    comment: >-
      This integration does not poll for data. It has no API and no external
      device or service. All data is entered directly by the user via HA
      services.

  brands:
    status: done
    comment: >-
      Branding assets are provided in the integration's brand directory.

  common-modules:
    status: done
    comment: >-
      Classes are in models.py, config flow in config_flow.py,
      sensor entities in sensor.py.

  config-flow-test-coverage:
    status: done
    comment: >-
      Config flow tests cover the successful setup flow, distance unit
      selection, and prevention of duplicate configuration entries.

  config-flow:
    status: done
    comment: >-
      This integration is configured through the Home Assistant config flow

  dependency-transparency:
    status: exempt
    comment: >-
      This integration has no external dependencies.

  docs-actions:
    status: done
    comment: >-
      The integration provides three custom service actions: add_vehicle,
      add_maintenance_item, and add_service_record. Each is documented with
      its parameters and purpose in services.yaml.

  docs-conditions:
    status: exempt
    comment: >-
      This integration does not provide any custom conditions.

  docs-high-level-description:
    status: done
    comment: >-
      A high-level prose description of the integration needs to be written
      in the integration's documentation page.

  docs-installation-instructions:
    status: done
    comment: >-
      Step-by-step installation instructions need to be written in the
      integration's documentation page.

  docs-removal-instructions:
    status: done
    comment: >-
      Instructions for removing the integration need to be written in the
      integration's documentation page.

  docs-triggers:
    status: exempt
    comment: >-
      This integration does not provide any custom triggers.

  entity-event-setup:
    status: exempt
    comment: >-
      VehicleSensor does not subscribe to any events. State is read on demand
      from the Vehicle object. No event subscription or unsubscription is needed.

  entity-unique-id:
    status: done
    comment: >-
      VehicleSensor.unique_id returns vehicle.vehicle_id, which is a generated
      UUID-based string guaranteed unique within the integration domain.

  has-entity-name:
    status: done
    comment: >-
      VehicleSensor sets _attr_has_entity_name = True and the name property
      returns only the vehicle's friendly name.

  runtime-data:
    status: done
    comment: >-
      The fleet dict is stored on entry.runtime_data via a typed alias
      VehicleMinder ConfigEntry = ConfigEntry[dict[str, Vehicle]]. No
      hass.data usage remains in the integration.

  test-before-configure:
    status: exempt
    comment: >-
      This integration has no connection to a device or service. It is a pure
      local data store (fleet registry). There is nothing to test in the config
      flow — the only input is a distance unit preference.

  test-before-setup:
    status: exempt
    comment: >-
      No external connection is made during async_setup_entry. All operations
      are local: reading stored JSON, reconstructing Python objects in memory,
      and registering services. The integration qualifies as a pure local
      calculation and is exempt from this rule.

  unique-config-entry:
    status: done
    comment: >-
      Uses async_set_unique_id(DOMAIN) + _abort_if_unique_id_configured() in
      async_step_user. The integration only supports a single config entry so
      DOMAIN is used as the fixed unique ID.

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
